<!doctype html>
<html lang="EN"><!-- manifest="cache.manifest"> -->
<head>
    <title id="title">jc://remote/</title>

    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">

    <link rel="icon" href="remote-v3/icon/favicon.png" sizes="any" type="image/svg+xml">
    <link rel=apple-touch-icon href="remote-v3/icon/rmc1.jpg">
    <link rel=apple-touch-icon-precomposed href="remote-v3/icon/rmc1.jpg">

    <!-- load main JavaScript files, dynamic load of additional files is managed at the end of this file -->

    <script src="/modules/modules_1.2.5.js"></script>
    <script src="/framework/app-fw.js"></script>
    <script src="/remote-v3/remote.js"></script>
    <style>
        .loading_overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 200;
            background: lightgray;
            height: 100%;
            width: 100%;
            border-radius: 0;
            border: 0;
            display: flex; /* Add flexbox */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            }
    </style>

</head>
<body>
    <div id="loading_overlay" class="loading_overlay">
        <div>
            <img src="framework/img/loading3.gif" style='height:100px;width:100px' alt="loading" />
            <br/>
            <span id="loading_overlay_info" style='color:#FF0044;text-align:center;'></span>
        </div>

    </div>

    <nav id="nav">
    <nav-logo id="rest_status"></nav-logo>

    <!-- APP specific header elements // START -->

    <nav-info id="menu-audio">
        <nav-info id="menu-audio3" style="cursor:pointer;">IIIIIIIIIIIIIIIIIIII</nav-info>
        <nav-info id="menu-audio2" style="cursor:pointer;"></nav-info>
        <nav-info id="menu-audio1" style="cursor:pointer;"></nav-info>
        <nav-info id="edit1"  onclick=""></nav-info><!--icon-->
        <nav-info id="attention"></nav-info>
        <nav-info id="menu-audio4"></nav-info><!--icon-->
    </nav-info>


    <!-- APP specific header elements // END -->

    <nav-title id="navTitle">Loading ...</nav-title>
    <ul>
      <li id="navi"><div onclick="appClickMenu();"  id="navi-click"><img src="img/button.png" alt="menu"/></div>
        <ul id='menuItems' style="visibility:hidden;"><!-- drop down menu - filled by script --></ul>
      </li>
    </ul>
    </nav>

    <div id="statusLED"><div id="red"></div></div>
    <div id="statusLEDload"><img src="framework/img/loading3.gif" alt="Loading ..."></div>
    <div id="headerRight" class="headerRight"></div>
    <div id="app_background" class="app_background"></div>
    <div id="app_content" class="app_content">

    <div id='devices'></div>
    &nbsp;<br/>
    &nbsp;<br/>
    <div id='reload_info'  style="width:100%;display:none;"></div>
    <div id='frame_block' class='frame_block'>
        <div id='frame_block_nav' class='frame_block_nav'>
            <div class='remote_nav' id='remote_nav'>
                <nav-b>
                    <ul>
                        <li>
                            <ul id='menuItems2'><!-- fixed menu for wide screens - filled by script --></ul>
                        </li>
                    </ul>
                </nav-b>
            </div>
        </div>
        <div id='setting_ext_top_frame' style="z-index:98;"></div>
        <div id="frame_block_content" class="frame_block_content">
            <div id='setting_ext_frames'></div>
            <div id='frames'></div>
            <div id='setting_frames'></div>
        </div>
    </div>

    <div id="appMsg"></div>
    <div id="ontop"        style="display:none"></div>
    <div id="theme_check"  style="display:none"></div>

    <!-- APP specific scripts and HTML elements // START -->

    <div id="audio_slider" class="audio_slider"></div>

    <!-- APP specific scripts and HTML elements // END -->

    <!-- load additional CSS and JavaScript files in specific order // START -->

    <script>

        loadScripts("/modules/",   modules_js);
        loadCss("/modules/",       modules_css);

        loadScripts("/framework/", app_js);
        loadCss("/framework/",     app_css);

        loadCss("/remote-v3/",     remote_css);
        loadScripts("/remote-v3/", remote_js);

        const LOAD_TIMEOUT_MS = 8000;
        const LOAD_POLL_MS = 50;
        let elapsed = 0;

        const checkInterval = setInterval(function() {
            const allLoaded =
                module_scripts_loaded === modules_js.length &&
                app_framework_loaded  === app_js.length &&
                remote_scripts_loaded === remote_js.length;

            if (allLoaded) {
                clearInterval(checkInterval);
                startApp();
                startRemote();
                elementHidden("loading_overlay");
            } else if (elapsed >= LOAD_TIMEOUT_MS) {
                clearInterval(checkInterval);
                const loaded_modules = {
                    module:    loadScriptsOk("/modules/",   modules_js, module_scripts_loaded),
                    framework: loadScriptsOk("/framework/", app_js,     app_framework_loaded),
                    remote:    loadScriptsOk("/remote-v3/", remote_js,  remote_scripts_loaded),
                };
                let message = "&nbsp;<br/>";
                for (const key of Object.keys(loaded_modules)) {
                    if (!loaded_modules[key]) {
                        message += `Could not load all <u>${key}</u> scripts.<br/>`;
                    }
                }
                message += "Check browser logging for details.";
                document.getElementById("loading_overlay_info").innerHTML = message;
            }

            elapsed += LOAD_POLL_MS;
        }, LOAD_POLL_MS);


    </script>

    <!-- load additional CSS and JavaScript files in specific order // END -->

    </div>
</body>
</html>
